<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Kipekee's identity is a wordmark ("Kipekee" over "CREATIONS"), and a wordmark
    is unreadable at 16px, so the favicon is a monogram cut from the same brand
    tokens: #A11C20 red ground, and a geometric K matching Poppins' construction.
    The letter is drawn as strokes rather than set as type because a favicon has
    no access to the page's web fonts and would silently fall back to whatever
    sans the OS ships.
  -->
  <rect width="64" height="64" rx="14" fill="#A11C20"/>
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M21.5 17.5V46.5"/>
    <path d="M26.5 32L41.5 17.5"/>
    <path d="M26.5 32L43 46.5"/>
  </g>
</svg>
